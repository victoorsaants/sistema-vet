# Gateway da API do Supabase local: expõe os serviços nos mesmos caminhos
# usados pelo Supabase na nuvem (ex.: /rest/v1/), que é o que o SDK espera.
_format_version: "3.0"

services:
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
